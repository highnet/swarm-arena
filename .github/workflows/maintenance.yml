# Agent sessions cannot delete refs, so they never do: a released claim or lease is moved onto a
# "rallypoint: released" marker commit, and merged or abandoned agent branches are left behind.
# This workflow is the janitor for both, and it also runs release-please. It deletes:
#   - released claim and lease refs (rallypoint-claims/*, rallypoint-sessions/*)
#   - the claim ref of any closed issue
#   - agent/<issue>-… branches once their pull request is closed, or when their issue is closed
#     or no longer claimed and no pull request is open from them
#
# GitHub Actions minutes are capped, so this is the repository's only workflow: one job, once a
# day (Actions bills each job rounded up to a whole minute, so a single job keeps it at one).
# Every check that judges a change — tests, the referee's games, preflight, review — runs in the
# Claude cloud sessions, never here. Waiting a day costs nothing: released refs already read as
# absent to every Rallypoint script, and release-please batches the day's merges into its PR.
# Run it by hand with "Run workflow" (workflow_dispatch) when a release is wanted sooner.
name: maintenance

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Delete released and orphaned coordination refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          del() { echo "delete $1"; gh api -X DELETE "repos/$REPO/git/refs/heads/$1" >/dev/null || echo "  (already gone)"; }

          # Released or closed-issue claims and leases.
          for prefix in rallypoint-claims rallypoint-sessions; do
            gh api "repos/$REPO/git/matching-refs/heads/$prefix" --jq '.[] | "\(.ref) \(.object.sha)"' |
            while read -r ref sha; do
              name="${ref#refs/heads/}"
              msg=$(gh api "repos/$REPO/git/commits/$sha" --jq .message)
              if [[ "$msg" == "rallypoint: released"* ]]; then del "$name"; continue; fi
              if [[ "$name" =~ ^rallypoint-claims/issue-([0-9]+)$ ]]; then
                state=$(gh api "repos/$REPO/issues/${BASH_REMATCH[1]}" --jq .state)
                # An `if`, not `&&`: under `set -e` + pipefail a false test ending the loop fails the job.
                if [ "$state" = closed ]; then del "$name"; fi
              fi
            done
          done

          # Agent branches nobody is working from any more.
          open_heads=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq '.[].head.ref')
          gh api "repos/$REPO/git/matching-refs/heads/agent/" --jq '.[].ref' |
          while read -r ref; do
            name="${ref#refs/heads/}"
            grep -qxF "$name" <<<"$open_heads" && continue
            [[ "$name" =~ ^agent/([0-9]+)- ]] || continue
            issue=$(gh api "repos/$REPO/issues/${BASH_REMATCH[1]}" --jq '[.state, ([.labels[].name] | index("status:claimed") != null)] | @tsv')
            state=$(cut -f1 <<<"$issue"); claimed=$(cut -f2 <<<"$issue")
            if [ "$state" = closed ] || [ "$claimed" = false ]; then del "$name"; fi
          done

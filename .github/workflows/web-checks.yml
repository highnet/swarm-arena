# Lint, typecheck and production build for the site and the shared types (the harness is
# typechecked too). The build catches what Vercel would reject (e.g. prerender errors) before merge.
#
# Actions minutes are capped (see maintenance.yml), so this runs only on pull requests that touch
# web/, shared/, swarm-graph/ or the package files, as one job with the npm cache. Other pull
# requests skip it; their checks (tests, the referee's games, preflight, review) run in the Claude cloud sessions.
#
# After the build, Impeccable's `detect` scans every page route at 1440 and 390 px against the
# production server (#218) and writes one table per route to the job summary. It reports, it does
# not gate: each route's redesign (#229-#233) quotes its row before and after.
name: web-checks

on:
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - "swarm-graph/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-checks.yml"

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Impeccable detect, per route
        working-directory: web
        run: |
          npx next start -p 3000 > ../next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/impeccable-routes.mjs http://localhost:3000 --json ../impeccable-routes.json
      - name: Keep the detect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-routes
          path: |
            impeccable-routes.json
            next-start.log
          if-no-files-found: ignore

# Lint, typecheck and production build for the site and the shared types (the harness is
# typechecked too). The build catches what Vercel would reject (e.g. prerender errors) before merge.
#
# Actions minutes are capped (see maintenance.yml), so this runs only on pull requests that touch
# web/, shared/, swarm-graph/ or the package files, as one job with the npm cache. Other pull
# requests skip it; their checks (tests, the referee's games, preflight, review) run in the Claude cloud sessions.
#
# After the build, Impeccable's `detect` scans every page route at 1440 and 390 px against the
# production server (#218) and writes one table per route to the job summary. It reports, it does
# not gate: each route's redesign (#229-#233) quotes its row before and after. Then the
# horizontal-overflow sweep (#249, web/scripts/overflow-check.mjs) does gate: no route may scroll
# sideways on a 320 or 390 px phone. To keep it cheap it installs only the playwright npm
# package and drives the runner's preinstalled Google Chrome (OVERFLOW_CHROME_CHANNEL=chrome);
# `playwright install --with-deps chromium` would add about 2.5 min of apt and download to every
# web pull request, so do not bring it back.
name: web-checks

on:
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - "swarm-graph/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-checks.yml"

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Impeccable detect, per route
        working-directory: web
        run: |
          npx next start -p 3000 > ../next-start.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/impeccable-routes.mjs http://localhost:3000 --json ../impeccable-routes.json
      - name: Horizontal overflow, every route at 320 and 390 px
        # Gates (#249): real phone emulation (iPhone SE, iPhone 13), both themes, menus and
        # disclosures opened. Fails when anything scrolls the page sideways.
        working-directory: web
        env:
          OVERFLOW_CHROME_CHANNEL: chrome
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.63.0 > /dev/null
          curl -fs -o /dev/null http://localhost:3000/ || (npx next start -p 3000 >> ../next-start.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/overflow-check.mjs http://localhost:3000
      - name: Real 404s for unknown ids on detail routes
        # Gates (#268): every detail route answers 404 for an id that names nothing, before its
        # shell streams. CI builds without Supabase, so there are no known games or seats to try:
        # the known-id 200s are checked against a build with data (see the script).
        working-directory: web
        run: |
          curl -fs -o /dev/null http://localhost:3000/ || (npx next start -p 3000 >> ../next-start.log 2>&1 &)
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3000/ && break; sleep 1; done
          node scripts/not-found-check.mjs http://localhost:3000 --allow-missing-known
      - name: Keep the detect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impeccable-routes
          path: |
            impeccable-routes.json
            next-start.log
          if-no-files-found: ignore
